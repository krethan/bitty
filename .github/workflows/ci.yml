name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  schedule:
    # Weekly heavy checks (cargo-deny audit + release smoke bench) — Mondays 06:00 UTC.
    - cron: "0 6 * * 1"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint with clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Run slow training tests
        run: cargo test -p bitllm-train -- --ignored

      - name: Build decoupled hip_tern standalone
        run: cargo build --manifest-path crates/hip_tern/Cargo.toml

  python:
    name: Python (${{ matrix.python-version }} scaffold & tests)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: pip install -e ./python[dev]

      - name: Compile check
        run: python -m py_compile python/bitty/*.py python/bitty/agent/*.py

      - name: Run unit tests
        working-directory: python
        run: pytest -v

      - name: Smoke test CLI
        run: bitty --goal "Verify CI pipeline"

  audit:
    name: Audit dependencies (weekly)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install --locked cargo-audit

      - name: Audit dependencies for known CVEs
        run: cargo audit

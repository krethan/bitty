[package]
name = "bitllm-benchmarks"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "run_benchmarks"
path = "src/main.rs"

[[bin]]
name = "bittransformer_bench"
path = "src/bittransformer_bench.rs"

[dependencies]
bitllm-tensor = { path = "../crates/tensor" }
bitllm-quantization = { path = "../crates/quantization" }
bitllm-runtime = { path = "../crates/runtime" }
bitllm-cognition = { path = "../crates/cognition" }
bitllm-train = { path = "../crates/train" }
bitllm-rocm = { path = "../crates/rocm", optional = true }
rand = "0.8"
rayon.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }

[features]
default = []
rocm = ["bitllm-rocm"]

[workspace]
resolver = "2"
members = [
    "crates/tensor",
    "crates/quantization",
    "crates/tokenizer",
    "crates/runtime",
    "crates/server",
    "crates/distributed",
    "crates/rocm",
    "crates/hip_tern",
    "crates/cognition",
    "benchmarks",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
rand = "0.8"
anyhow = "1.0"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
log = "0.4"
env_logger = "0.11"
rayon = "1"
byteorder = "1"
num_cpus = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7" }
tower = { version = "0.4" }
tower-http = { version = "0.5", features = ["cors", "trace"] }
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
tokio-stream = "0.1"

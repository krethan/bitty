[workspace]
resolver = "2"
members = [
    "crates/tensor",
    "crates/quantization",
    "crates/tokenizer",
    "crates/runtime",
    "crates/server",
    "crates/distributed",
    "crates/rocm",
    "crates/cognition",
    "crates/train",
    "benchmarks",
]

# hip_tern (AMD RDNA3 HIP ternary-attention kernel) is kept in the repo but
# decoupled from the default workspace build until a HIP toolchain is present.
# Build it standalone: cargo build --manifest-path crates/hip_tern/Cargo.toml --features hip
exclude = ["crates/hip_tern"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
rand = "0.8"
anyhow = "1.0"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
log = "0.4"
env_logger = "0.11"
rayon = "1"
byteorder = "1"
num_cpus = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
tokio-stream = "0.1"
wide = "0.7"

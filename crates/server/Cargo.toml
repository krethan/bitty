[package]
name = "bitllm-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "bitllm"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
log.workspace = true
env_logger.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
uuid.workspace = true
clap.workspace = true
chrono.workspace = true
rand.workspace = true
hex.workspace = true
tokio-stream.workspace = true
futures = "0.3"

bitllm-runtime = { path = "../runtime" }
bitllm-tokenizer = { path = "../tokenizer" }
bitllm-tensor = { path = "../tensor" }
bitllm-rocm = { path = "../rocm" }
rayon.workspace = true

[features]
default = []
# Same caveats as bitllm-runtime's `gpu` feature: requires a ROCm toolchain.
gpu = ["bitllm-runtime/gpu"]

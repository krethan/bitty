[package]
name = "hip_tern"
version = "0.1.0"
edition = "2021"
authors = ["Shawn Williams <shawn@nousresearch.com>"]
description = "AMD RDNA3 HIP-based Ternary-Exponential Attention Kernel for Project Mercurial"
license = "MIT"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
half = "2.7.1"
rand = "0.8.5"

# Optional HIP runtime for AMD ROCm
[target.'cfg(target_os = "linux")'.dependencies]
hip-runtime-sys = { version = "0.1.0", optional = true }

[features]
default = []
hip = ["hip-runtime-sys"]

[build-dependencies]

[lib]
name = "hip_tern"
path = "src/lib.rs"
